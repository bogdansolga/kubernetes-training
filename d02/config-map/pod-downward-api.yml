# Day 2 · lecture 7.1 — the Downward API exposes Pod/container metadata to the app
# (name, namespace, node, labels, resource limits) without hard-coding it.
apiVersion: v1
kind: Pod
metadata:
  name: skyhop-downward-api
  labels:
    app: skyhop-be
spec:
  restartPolicy: Never
  containers:
    - name: show-meta
      image: busybox:1.36
      command: ["sh", "-c", "echo POD=$POD_NAME NS=$POD_NAMESPACE NODE=$NODE_NAME; sleep 3600"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
