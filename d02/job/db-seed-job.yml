# Day 2 · lecture 8.1 — a Job runs a task to completion, then stops (unlike a Deployment).
# Here: a one-off DB seed/migration against the SkyHop Postgres.
# Prereq: the Postgres StatefulSet (../statefulset) is running.
apiVersion: batch/v1
kind: Job
metadata:
  name: skyhop-db-seed
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 120        # auto-clean the finished Job after 2 min
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-seed
          image: postgres:18-alpine
          env:
            - name: PGPASSWORD
              value: aVeryComplexPassword
          command:
            - sh
            - -c
            - |
              psql -h postgres -U flights -d flights -c \
                "CREATE TABLE IF NOT EXISTS seed_demo (id serial PRIMARY KEY, note text);
                 INSERT INTO seed_demo (note) VALUES ('seeded by the Day-2 Job');"
              psql -h postgres -U flights -d flights -c "SELECT count(*) AS rows FROM seed_demo;"
