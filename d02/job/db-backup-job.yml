# Day 2 · lecture 8.1 — a Job runs a task to completion, then stops (unlike a Deployment).
# Here: a one-off, on-demand DB backup (pg_dump) of the SkyHop database. The SAME task on a
# schedule is a CronJob — see ../cronjob (which dumps to a persistent volume).
# Prereq: the Postgres StatefulSet (../statefulset) is running.
apiVersion: batch/v1
kind: Job
metadata:
  name: skyhop-db-backup
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 120        # auto-clean the finished Job after 2 min
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pg-dump
          image: postgres:18-alpine
          env:
            - name: PGPASSWORD
              value: aVeryComplexPassword
          command:
            - sh
            - -c
            - |
              pg_dump -h postgres -U flights -d flights > /tmp/flights.sql
              echo "backup OK: $(wc -l < /tmp/flights.sql) lines, $(wc -c < /tmp/flights.sql) bytes"
              echo '--- first lines of the dump ---'; head -8 /tmp/flights.sql
