# Day 2 · lecture 5.2 — a DaemonSet runs one Pod on EVERY node (node-level infrastructure:
# log shippers, metrics/monitoring agents, CNI, …). It is cluster infra, not a SkyHop tier.
# The control-plane toleration lets it run on control-plane nodes too.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: node-agent
          image: busybox:1.36
          command: ["sh", "-c", "echo agent running on $NODE_NAME; sleep 3600"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
