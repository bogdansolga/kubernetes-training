# Day 2 · lecture 5.2 — a DaemonSet runs one Pod on EVERY node. The canonical use-case is a
# node-level agent; here the Prometheus **node-exporter**, which exposes each host's
# CPU/memory/disk/network metrics on :9100. This is cluster infrastructure (a metrics agent),
# NOT a SkyHop tier — SkyHop's tiers are replica-scaled (Deployments/StatefulSet), never per-node.
# hostNetwork/hostPID + the host rootfs mount let it read real node metrics; the control-plane
# toleration makes it run on every node, including the control plane.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.rootfs=/host
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
