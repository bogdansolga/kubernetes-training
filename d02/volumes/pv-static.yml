# Day 2 · lecture S06 — STATIC provisioning: an admin pre-creates a PersistentVolume.
# A PVC (pvc-static.yml) then binds to it by matching storageClassName + access mode + size.
# (hostPath is single-node/dev only — real clusters use NFS, EBS, etc.)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: skyhop-pv-static
  labels:
    app: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/skyhop-pv-static
