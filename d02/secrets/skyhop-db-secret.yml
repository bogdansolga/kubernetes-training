# Day 2 · lecture 7.2 — a Secret holds sensitive values (base64-encoded at rest in etcd).
# `stringData` lets you write plaintext; Kubernetes encodes it. These are the SkyHop DB creds,
# the same ones the Postgres StatefulSet and the backup CronJob consume.
apiVersion: v1
kind: Secret
metadata:
  name: skyhop-db-secret
type: Opaque
stringData:
  POSTGRES_USER: flights
  POSTGRES_PASSWORD: aVeryComplexPassword
