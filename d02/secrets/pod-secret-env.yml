# Day 2 · lecture 7.2 — consume a Secret as environment variables (secretKeyRef).
apiVersion: v1
kind: Pod
metadata:
  name: skyhop-secret-env
spec:
  restartPolicy: Never
  containers:
    - name: show-secret
      image: busybox:1.36
      command: ["sh", "-c", "echo user=$DB_USER ; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: skyhop-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skyhop-db-secret
              key: POSTGRES_PASSWORD
