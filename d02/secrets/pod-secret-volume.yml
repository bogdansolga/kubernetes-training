# Day 2 · lecture 7.2 — mount a Secret as files (one file per key) under a directory.
# Mounted secrets update automatically when the Secret changes; env vars do not.
apiVersion: v1
kind: Pod
metadata:
  name: skyhop-secret-volume
spec:
  restartPolicy: Never
  containers:
    - name: show-secret
      image: busybox:1.36
      command: ["sh", "-c", "ls -1 /etc/db && echo --- && cat /etc/db/POSTGRES_USER; echo; sleep 3600"]
      volumeMounts:
        - name: db
          mountPath: /etc/db
          readOnly: true
  volumes:
    - name: db
      secret:
        secretName: skyhop-db-secret
