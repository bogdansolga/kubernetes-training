# Day 3 · lecture 11.2 — a RoleBinding grants a Role to a subject (User / Group / ServiceAccount)
# within that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skyhop-deployer
  namespace: skyhop
subjects:
  - kind: User
    name: deployer@skyhop
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: skyhop-deployer
  apiGroup: rbac.authorization.k8s.io
