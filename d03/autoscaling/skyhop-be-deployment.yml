# Day 3 · lecture S10 — the target Deployment for autoscaling. The HPA scales it on CPU/memory
# *utilisation*, which is measured against the container's resource **requests** — so requests
# MUST be set for an HPA to work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyhop-be
  labels:
    app: skyhop-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skyhop-be
  template:
    metadata:
      labels:
        app: skyhop-be
    spec:
      containers:
        - name: skyhop-be
          image: bogdansolga/skyhop-be:0.1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
