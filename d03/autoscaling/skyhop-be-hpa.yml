# Day 3 · lecture S10 — a HorizontalPodAutoscaler scales the skyhop-be Deployment between
# minReplicas and maxReplicas to keep CPU/memory utilisation near the targets.
# autoscaling/v2 supports multiple metrics (here CPU + memory); needs metrics-server installed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skyhop-be
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skyhop-be
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
