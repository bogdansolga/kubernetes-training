# Day 3 · monitoring — Grafana datasource provisioning: wires Grafana to Prometheus automatically
# (mounted at /etc/grafana/provisioning/datasources), so no manual click-through on first login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
