# Day 3 (stretch) · edge / TLS — exposes Caddy's HTTPS (443) and HTTP (80) ports inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: caddy
  labels:
    app: caddy
spec:
  type: ClusterIP
  selector:
    app: caddy
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: http
      port: 80
      targetPort: 80
